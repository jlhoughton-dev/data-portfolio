version: 2

sources:
  - name: chinook_raw
    database: jlhoughton-dev
    schema: chinook_raw
    description: Raw Chinook source tables from Google BigQuery.
    tables:
      - name: albums
      - name: artists
      - name: customers
      - name: employees
      - name: genres
      - name: invoiceitems
      - name: invoices
      - name: mediatypes
      - name: playlists
      - name: playlisttrack
      - name: tracks
  - name: raw_vetsample
    database: jlhoughton-dev
    schema: vet_saas
    description: Dummy data for a veterinary SaaS application, used for dbt testing and demos.
    tables:
      - name: dim_clinics
      - name: fct_billing
      - name: fct_scribe_events
      - name: raw_clinics
      - name: raw_billing
      - name: raw_scribe_events